name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n dbtool.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error --shell=bash dbtool.sh

      - name: example configs parse
        run: |
          python3 -c "import json; json.load(open('dbtool.example.json')); print('json ok')"
          python3 - <<'PY'
          try:
              import yaml
          except ImportError:
              raise SystemExit("pyyaml missing")
          yaml.safe_load(open("dbtool.example.yml"))
          print("yaml ok")
          PY

      - name: cli smoke test
        run: |
          ./dbtool.sh --version
          ./dbtool.sh --help > /dev/null
          ./dbtool.sh parse-url 'postgresql+asyncpg://u:p@db.example.com:5432/appdb'

      - name: no secrets committed
        run: |
          if git ls-files | grep -Ex 'dbtool\.(env|ya?ml|json)'; then
            echo "::error::a live config/env file is tracked"; exit 1
          fi
          if git grep -nEI "(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9_@#!%-]{8,}" \
               -- ':!*example*' ':!README.md' ':!.github/*'; then
            echo "::error::possible hardcoded credential"; exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: install postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          REPO="https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "deb [signed-by=$KEY] $REPO" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 zstd
          pg_dump --version

      - name: write test config
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          cat > "$RUNNER_TEMP/dbtool.yml" <<YML
          defaults:
            backup_dir: $RUNNER_TEMP/backups
            log_file: $RUNNER_TEMP/dbtool.log
            retention_days: 1
            retention_min_keep: 1
            docker: auto
          databases:
            - name: ci_db
              engine: postgres
              host: 127.0.0.1
              port: 5432
              user: postgres
              password: ci_password
              database: ci_db
            # entry name of which "ci_db" is a strict prefix: the old glob
            # "ci_db_*" matched this one's dumps too
            - name: ci_db_extra
              engine: postgres
              host: 127.0.0.1
              port: 5432
              user: postgres
              password: ci_password
              database: ci_db
          targets:
            ci_restore:
              engine: postgres
              host: 127.0.0.1
              port: 5432
              user: postgres
              password: ci_password
              database: ci_restored
              create: true
          YML

      - name: seed data
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h 127.0.0.1 -U postgres -d ci_db -c \
            "create table t(id serial primary key, v text); insert into t(v) select 'row'||g from generate_series(1,1000) g;"
          # big enough that a 1s timeout always cuts the dump in half
          psql -h 127.0.0.1 -U postgres -d ci_db -c \
            "create table big(id int, v text); insert into big select g, md5(g::text)||md5((g+1)::text) from generate_series(1,800000) g;"

      - name: test / backup / verify / restore / prune
        run: |
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" test
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup all -y
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" list
          for f in "$RUNNER_TEMP"/backups/*.dump; do ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" verify "$f"; done
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" restore --latest ci_db -t ci_restore --create -y
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" prune

      - name: assert restored row count
        env:
          PGPASSWORD: ci_password
        run: |
          n=$(psql -h 127.0.0.1 -U postgres -d ci_restored -Atc 'select count(*) from t')
          echo "restored rows: $n"
          [ "$n" = "1000" ]

      - name: cluster globals are dumped
        run: |
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" globals
          f=$(ls "$RUNNER_TEMP"/backups/globals_*_postgres_globals_*.sql* | head -1)
          echo "globals: $f"
          case "$f" in *.zst) zstd -dc "$f";; *.gz) gzip -dc "$f";; *) cat "$f";; esac | grep -q 'CREATE ROLE'
          [ "$(stat -c %a "$f")" = "600" ]

      - name: regression - --latest must not match a longer sibling entry
        run: |
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup ci_db -y
          sleep 1
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup ci_db_extra -y   # newer than ci_db's
          picked=$(./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" restore --latest ci_db \
                     -t ci_restore -n -y | sed -n 's/.*latest: //p' | head -1)
          echo "picked: $picked"
          case "$picked" in
            ci_db_postgres_*) echo "correct dump chosen" ;;
            *) echo "::error::--latest ci_db picked $picked"; exit 1 ;;
          esac

      - name: regression - a truncated dump must be rejected, not renamed
        run: |
          mkdir -p "$RUNNER_TEMP/backups-t"
          sed -e "s#backup_dir: .*#backup_dir: $RUNNER_TEMP/backups-t#" \
              -e "s#^  timeout:.*##" \
              -e "s#^  docker: auto#  docker: auto\n  timeout: 1#" \
              "$RUNNER_TEMP/dbtool.yml" > "$RUNNER_TEMP/dbtool-timeout.yml"
          if ./dbtool.sh -c "$RUNNER_TEMP/dbtool-timeout.yml" backup ci_db -y; then
            echo "::error::a dump killed by the 1s timeout was reported as success"; exit 1
          fi
          if ls "$RUNNER_TEMP"/backups-t/*.dump 2>/dev/null; then
            echo "::error::a truncated dump was renamed into place"; exit 1
          fi
          echo "timed-out dump correctly failed and left nothing behind"

      - name: regression - verify must read the whole archive, not just the header
        run: |
          good=$(ls -t "$RUNNER_TEMP"/backups/ci_db_postgres_*.dump | head -1)
          trunc="$RUNNER_TEMP/backups/trunc_postgres_ci_db_20200101-000000.dump"
          head -c 200000 "$good" > "$trunc"
          cp "$good.meta.json" "$trunc.meta.json"
          ( cd "$RUNNER_TEMP/backups" && sha256sum "$(basename "$trunc")" > "$(basename "$trunc").sha256" )
          pg_restore -l "$trunc" > /dev/null && echo "header alone still lists this truncated dump"
          if ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" verify "$trunc"; then
            echo "::error::verify accepted a truncated dump"; exit 1
          fi
          rm -f "$trunc" "$trunc.meta.json" "$trunc.sha256"
          echo "verify correctly rejected the truncated dump"

      - name: regression - a dry run must not write anything
        run: |
          mkdir -p "$RUNNER_TEMP/backups-dry"
          sed "s#backup_dir: .*#backup_dir: $RUNNER_TEMP/backups-dry#" \
              "$RUNNER_TEMP/dbtool.yml" > "$RUNNER_TEMP/dbtool-dry.yml"
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool-dry.yml" backup all -n -y
          left=$(find "$RUNNER_TEMP/backups-dry" -type f ! -name '.dbtool.lock' | wc -l)
          [ "$left" = "0" ] || { find "$RUNNER_TEMP/backups-dry" -type f; echo "::error::dry run wrote $left file(s)"; exit 1; }
          echo "dry run left the directory clean"

      - name: regression - an orphaned .part is swept, a stray argument is refused
        run: |
          touch "$RUNNER_TEMP/backups/ci_db_postgres_ci_db_20200101-000000.dump.part"
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup ci_db -y 2>&1 | grep -q 'removed orphaned'
          [ -z "$(find "$RUNNER_TEMP/backups" -name '*.part')" ] || { echo "::error::.part survived"; exit 1; }
          if ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup all globals -n -y; then
            echo "::error::a stray positional argument was accepted"; exit 1
          fi
          echo "orphan swept and stray argument refused"

      - name: regression - concurrent runs must not overlap
        run: |
          # hold dbtool's own lock file from outside, so the race is deterministic
          flock -x "$RUNNER_TEMP/backups/.dbtool.lock" sleep 15 &
          holder=$!
          sleep 2
          st=0
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup ci_db -y > "$RUNNER_TEMP/lock.log" 2>&1 || st=$?
          cat "$RUNNER_TEMP/lock.log"
          kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
          [ "$st" != "0" ] || { echo "::error::dbtool ran while the lock was held"; exit 1; }
          grep -q 'refusing to run concurrently' "$RUNNER_TEMP/lock.log"
          echo "second run was refused while the lock was held"
