name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n dbtool.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error --shell=bash dbtool.sh

      - name: example configs parse
        run: |
          python3 -c "import json; json.load(open('dbtool.example.json')); print('json ok')"
          python3 - <<'PY'
          try:
              import yaml
          except ImportError:
              raise SystemExit("pyyaml missing")
          yaml.safe_load(open("dbtool.example.yml"))
          print("yaml ok")
          PY

      - name: cli smoke test
        run: |
          ./dbtool.sh --version
          ./dbtool.sh --help > /dev/null
          ./dbtool.sh parse-url 'postgresql+asyncpg://u:p@db.example.com:5432/appdb'

      - name: no secrets committed
        run: |
          if git ls-files | grep -Ex 'dbtool\.(env|ya?ml|json)'; then
            echo "::error::a live config/env file is tracked"; exit 1
          fi
          if git grep -nEI "(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9_@#!%-]{8,}" \
               -- ':!*example*' ':!README.md' ':!.github/*'; then
            echo "::error::possible hardcoded credential"; exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: install postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          REPO="https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "deb [signed-by=$KEY] $REPO" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 zstd
          pg_dump --version

      - name: write test config
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          cat > "$RUNNER_TEMP/dbtool.yml" <<YML
          defaults:
            backup_dir: $RUNNER_TEMP/backups
            log_file: $RUNNER_TEMP/dbtool.log
            retention_days: 1
            retention_min_keep: 1
            docker: auto
          databases:
            - name: ci_db
              engine: postgres
              host: 127.0.0.1
              port: 5432
              user: postgres
              password: ci_password
              database: ci_db
          targets:
            ci_restore:
              engine: postgres
              host: 127.0.0.1
              port: 5432
              user: postgres
              password: ci_password
              database: ci_restored
              create: true
          YML

      - name: seed data
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h 127.0.0.1 -U postgres -d ci_db -c \
            "create table t(id serial primary key, v text); insert into t(v) select 'row'||g from generate_series(1,1000) g;"

      - name: test / backup / verify / restore / prune
        run: |
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" test
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" backup all -y
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" list
          for f in "$RUNNER_TEMP"/backups/*.dump; do ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" verify "$f"; done
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" restore --latest ci_db -t ci_restore --create -y
          ./dbtool.sh -c "$RUNNER_TEMP/dbtool.yml" prune

      - name: assert restored row count
        env:
          PGPASSWORD: ci_password
        run: |
          n=$(psql -h 127.0.0.1 -U postgres -d ci_restored -Atc 'select count(*) from t')
          echo "restored rows: $n"
          [ "$n" = "1000" ]
